<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Akanta Books – accounting workspace for Geoinfotech Holdings">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Akanta Books</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating sidebar panel on a soft canvas, one scrolling work area; tables and forms in quiet cards (ref: ERP / Ofacc / Logistics shots) */
:root{
  --canvas:#eef0f3; --surface:#ffffff; --surface-2:#f6f7f9; --surface-3:#eceff3;
  --line:#e3e6eb; --line-2:#eef0f3;
  --ink:#111318; --ink-2:#4b515d; --ink-3:#878d99;
  --primary:#121418; --primary-ink:#ffffff;
  --accent:#2f5bea; --accent-soft:#e9efff; --accent-ink:#1d3fb8;
  --good:#11805b; --good-soft:#e5f5ee; --warn:#a96300; --warn-soft:#fdf2df; --bad:#c3311b; --bad-soft:#fdebe8;
  --c-in:#139a68; --c-out:#e0486c; --c-3:#2f5bea; --c-4:#f2a51f; --c-5:#8a5cf6; --c-6:#14a3b8;
  --shadow:0 1px 2px rgba(17,19,24,.05),0 1px 1px rgba(17,19,24,.03);
  --shadow-lg:0 18px 50px -12px rgba(17,19,24,.25),0 2px 6px rgba(17,19,24,.06);
  --paper:#ffffff; --paper-ink:#15171c;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --canvas:#0b0c0f; --surface:#14161b; --surface-2:#1a1d23; --surface-3:#22262e;
  --line:#272b33; --line-2:#1f2229;
  --ink:#eef0f4; --ink-2:#b4b9c3; --ink-3:#7c8290;
  --primary:#f1f2f5; --primary-ink:#111318;
  --accent:#7393ff; --accent-soft:#1b2342; --accent-ink:#a9bcff;
  --good:#3cc28f; --good-soft:#11271e; --warn:#f0b24c; --warn-soft:#2b2211; --bad:#ff7a66; --bad-soft:#2e1613;
  --c-in:#3cc28f; --c-out:#ff6f91; --c-3:#7393ff; --c-4:#f4b544; --c-5:#a688ff; --c-6:#3dc4d8;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 20px 60px -10px rgba(0,0,0,.7);
  --paper:#fbfbfa; --paper-ink:#15171c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --canvas:#0b0c0f; --surface:#14161b; --surface-2:#1a1d23; --surface-3:#22262e;
  --line:#272b33; --line-2:#1f2229;
  --ink:#eef0f4; --ink-2:#b4b9c3; --ink-3:#7c8290;
  --primary:#f1f2f5; --primary-ink:#111318;
  --accent:#7393ff; --accent-soft:#1b2342; --accent-ink:#a9bcff;
  --good:#3cc28f; --good-soft:#11271e; --warn:#f0b24c; --warn-soft:#2b2211; --bad:#ff7a66; --bad-soft:#2e1613;
  --c-in:#3cc28f; --c-out:#ff6f91; --c-3:#7393ff; --c-4:#f4b544; --c-5:#a688ff; --c-6:#3dc4d8;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 20px 60px -10px rgba(0,0,0,.7);
  --paper:#fbfbfa; --paper-ink:#15171c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
h1,h2,h3{text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- App frame ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);gap:12px;height:100%;
  padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.side{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ws{display:flex;align-items:center;gap:10px;margin:12px;width:calc(100% - 24px);padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.ws:hover{background:var(--surface-2)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.ws .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws .s{font-size:11.5px;color:var(--ink-3)}
.ws .grow{min-width:0;flex:1;overflow:hidden}
.crumbs .cn{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
.nav h6{margin:16px 8px 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:9px;color:var(--ink-2);cursor:pointer;text-align:left;font-size:13.5px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--surface-3);color:var(--ink);font-weight:600}
.nav button svg{flex:none;opacity:.85}
.nav .badge{margin-left:auto}
.side-foot{border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;background:var(--accent-soft);color:var(--accent-ink)}
.side-foot .who{min-width:0;flex:1}
.side-foot .who b{display:block;font-size:13px}
.side-foot select{width:100%;border:0;background:none;color:var(--ink-3);font-size:12px;padding:0;cursor:pointer}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);min-height:62px}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.search{position:relative;width:min(320px,32vw)}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 44px 0 34px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:10px;top:10px;color:var(--ink-3)}
.search kbd{position:absolute;right:8px;top:8px;font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
.dd{position:absolute;top:calc(100% + 6px);right:0;min-width:280px;max-width:min(420px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:40;max-height:420px;overflow:auto}
.dd .it{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer;color:var(--ink)}
.dd .it:hover{background:var(--surface-2)}
.dd .it small{display:block;color:var(--ink-3);font-size:12px}
.dd h6{margin:8px 10px 4px;font-size:11px;color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.rel{position:relative}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--ink-2);position:relative;flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.menu-btn{display:none}
.content{flex:1;overflow:auto;padding-block:24px 40px;padding-inline:28px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--ink-3)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.pri:hover{opacity:.9}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--ink-3);font-weight:500}
.in,select.in,textarea.in{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;outline:none;width:100%;min-width:0}
textarea.in{height:auto;padding:10px 12px;resize:vertical;min-height:80px;font-family:var(--mono);font-size:12.5px}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.sm{height:32px;font-size:13px;border-radius:8px;padding:0 9px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:600}
.card-h .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.card-b{padding:16px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .k{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.up{color:var(--good)} .down{color:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.chartbox{position:relative;height:300px}
.chartbox.sm{height:220px}

/* ---------- Pills, tabs ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill .dt{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.badge.bad{background:var(--bad)} .badge.warn{background:var(--warn)} .badge.mute{background:var(--surface-3);color:var(--ink-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--ink-3);cursor:pointer;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink-3);font-size:12.5px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--surface-2)}
.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .c{text-align:center}
.t .nowrap{white-space:nowrap}
.t tr.click{cursor:pointer}
.t tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
.party{display:flex;gap:10px;align-items:center;min-width:0}
.party .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.party b{font-weight:500;display:block}
.party small{color:var(--ink-3);display:block;font-size:12px}
.muted{color:var(--ink-3)}
.amt-in{color:var(--good)} .amt-out{color:var(--ink)}
.empty{padding:36px 18px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px}
.toolbar .l,.toolbar .rt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.minisearch{position:relative}
.minisearch input.in{padding-left:32px;width:220px}
.minisearch svg{position:absolute;left:10px;top:11px;color:var(--ink-3)}

/* ---------- Bars & lists ---------- */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bar-row .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .vl{font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.bar-row .tr{grid-column:1/-1;height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:99px;background:var(--c-3)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.callout.bad{background:var(--bad-soft);border-color:transparent}
.callout.warn{background:var(--warn-soft);border-color:transparent}
.callout.good{background:var(--good-soft);border-color:transparent}
.callout .ic{flex:none;margin-top:1px}
.callout.bad .ic{color:var(--bad)} .callout.warn .ic{color:var(--warn)} .callout.good .ic{color:var(--good)}
.callout p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.list{display:flex;flex-direction:column}
.list .li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.list .li:last-child{border-bottom:0}
.list .li .grow{flex:1;min-width:0}
.list .li small{display:block;color:var(--ink-3);font-size:12px}
.tag{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap}
.legend .lg{display:flex;flex-direction:column;gap:1px}
.legend .lg span{display:flex;gap:7px;align-items:center;font-size:12.5px;font-weight:500}
.legend .lg i{width:10px;height:10px;border-radius:3px}
.legend .lg small{font-size:12px;color:var(--ink-3);padding-left:17px;font-variant-numeric:tabular-nums}

/* ---------- Upload ---------- */
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:30px 18px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:15px;margin:10px 0 4px}
.drop .muted{font-size:13px}

/* ---------- Paper (reports, invoice) ---------- */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:12px;padding:36px 40px;box-shadow:var(--shadow)}
.paper .muted{color:#6b707b}
.paper h2{font-size:20px;letter-spacing:-.01em}
.rep{width:100%;border-collapse:collapse;font-size:13.5px;color:var(--paper-ink)}
.rep td{padding:7px 6px;border-bottom:1px solid #eef0f2}
.rep td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;width:150px}
.rep tr.hd td{font-weight:600;padding-top:18px;border-bottom:1px solid #d9dce1;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#555b66}
.rep tr.sub td{font-weight:600}
.rep tr.tot td{font-weight:700;border-top:2px solid #15171c;border-bottom:3px double #15171c}
.rep tr.ln td:first-child{padding-left:16px}
.rep tr.dl{cursor:pointer}
.rep tr.dl:hover td{background:#f3f5f9}
.rep .neg{color:#b42318}
.rep-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid #e3e6eb;padding-bottom:16px;margin-bottom:8px}
.rep-head .co{font-weight:700;font-size:15px}

/* invoice editor */
.inv-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.inv-form{padding:20px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);min-width:0}
.inv-form h4{margin:0;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.inv-prev{background:var(--surface-2);padding:24px;min-width:0}
.inv-prev .paper{padding:30px;font-size:12.5px}
.items{width:100%;border-collapse:collapse}
.items th{font-size:11.5px;color:var(--ink-3);font-weight:500;text-align:left;padding:0 6px 6px}
.items td{padding:3px}
.items .in{height:34px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.chipbtn.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.inv-foot{position:sticky;bottom:-40px;display:flex;justify-content:flex-end;gap:8px;padding:14px 0 0;flex-wrap:wrap}
.pv-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pv-logo{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#15171c;color:#fff;display:grid;place-items:center;font-weight:700}
.pv-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12px;margin-top:18px}
.pv-items{width:100%;border-collapse:collapse;margin-top:22px;font-size:12px}
.pv-items th{text-align:left;border-top:1.5px solid #15171c;border-bottom:1px solid #d8dbe0;padding:8px 4px;font-weight:600}

  modal({ title: `Void ${inv.no}?`, body: `<p style="margin:0">This reverses the sale and VAT in the ledger with a dated reversal entry. The invoice stays in the audit trail.</p><div class="field"><label for="vWhy">Reason</label><input class="in" id="vWhy" placeholder="e.g. Raised in error, customer cancelled order"></div>`, foot: `<button class="btn" data-act="close-modal">Keep invoice</button><button class="btn pri" id="vGo">Void invoice</button>`, onMount: () => $('#vGo').onclick = () => attempt(() => { const j = c.journals.find(j => j.id === inv.journalId); if (j) reverseJournal(c, j, TODAY < inv.date ? inv.date : TODAY, $('#vWhy').value); inv.status = 'void'; audit('Voided invoice', inv.no, $('#vWhy').value || '—'); closeModal(); toast(inv.no + ' voided'); render(); }) });

ACT['pay-invoice'] = el => {
  const c = C(); const inv = c.invoices.find(i => i.id === el.dataset.id); const exp = r2(invExpected(inv) - invPaid(inv));
  modal({ title: `Record payment · ${inv.no}`, body: `<div class="grid2"><div class="field"><label for="pDate">Date received</label><input type="date" class="in" id="pDate" value="${TODAY}"></div><div class="field"><label for="pAmt">Amount received (₦)</label><input class="in tnum" id="pAmt" value="${exp}" inputmode="decimal"></div></div>
    ${inv.wht ? `<div class="callout"><span class="ic">${ic('info', 18)}</span><div><b>Customer deducts ${inv.wht}% WHT</b><p>Expected cash: ${money(invExpected(inv))}. The ${money(invTotals(inv).wht)} difference is booked as a WHT credit note you can use against your CIT.</p></div></div>` : ''}
    <p class="muted" style="margin:0;font-size:12.5px">When this payment shows up in your next bank statement import, it will be matched automatically, not double-counted.</p>`,
    foot: `<button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" id="pGo">Record payment</button>`,
    onMount: () => $('#pGo').onclick = () => attempt(() => {
      const date = $('#pDate').value, amt = r2(parseAmt($('#pAmt').value)); if (!amt) throw new Error('Enter the amount received');
      const full = amt >= exp - 1; const whtPart = full ? r2(invTotals(inv).total - invPaid(inv) - amt) : 0;
      const j = postJournal(c, { date, memo: `Payment for ${inv.no}`, ref: inv.no, source: 'payment', srcId: inv.id, party: custOf(c, inv.customerId)?.name, lines: [{ a: '1000', dr: amt }, { a: '1160', dr: whtPart > 0.5 ? whtPart : 0 }, { a: '1100', cr: r2(amt + (whtPart > 0.5 ? whtPart : 0)) }] });
      inv.payments = inv.payments || []; inv.payments.push({ date, amount: amt, journalId: j.id }); audit('Recorded payment', inv.no, money(amt)); closeModal(); toast('Payment recorded'); render();
    }) });
};

ACT['save-inv'] = el => {
  const c = C(); const d = UI.draft; const send = el.dataset.send === '1'; if (!guard('invoice', 'create invoices')) return;
  if (!d.customerId) return toast('Choose a customer', true);
  d.items = d.items.filter(it => it.desc || +it.rate); if (!d.items.length) { d.items = [{ desc: '', qty: 1, rate: 0 }]; return toast('Add at least one line item with a price', true); }
  if (invTotals(d).total <= 0) return toast('The invoice total must be more than zero', true);
  if (c.invoices.some(i => i.no === d.no && i.id !== d.id)) return toast(`Invoice number ${d.no} is already used`, true);
  attempt(() => {
    let inv = d.id ? c.invoices.find(i => i.id === d.id) : null;
    if (inv) Object.assign(inv, d); else { inv = { ...d, id: uid('inv'), createdAt: TODAY }; c.invoices.push(inv); const n = +d.no.split('-').pop(); if (n > (c.invSeq || 0)) c.invSeq = n; }
    if (send) { postInvoice(c, inv); inv.status = 'sent'; }
    audit(send ? 'Created & sent invoice' : 'Saved invoice draft', inv.no, money(invTotals(inv).total));
    UI.draft = null; UI.invTab = send ? 'awaiting' : 'draft'; toast(send ? `${inv.no} created and posted (Dr Receivables, Cr Sales & VAT)` : `${inv.no} saved as draft`); go('invoices');
  });
};

  const open = c.bills.filter(b => !b.paidOn); const od = open.filter(b => b.due < TODAY); const curK = mKey(TODAY);

VIEWS.ledger = () => {

  <tr><td class="nowrap">${from ? dLabel(from) : 'Start'}</td><td></td><td><b>Opening balance</b></td><td></td><td></td><td></td><td class="r"><b>${money(opening)}</b></td></tr>

function cashFlow(c, from, to) {
  const cc = cashCodes(c); const types = {}; c.accounts.forEach(a => types[a.code] = a);

  for (const j of c.journals) {

    const cash = j.lines.filter(l => cc.includes(l.a)).reduce((s, l) => s + l.dr - l.cr, 0); if (Math.abs(cash) < .005) continue;
    const others = j.lines.filter(l => !cc.includes(l.a)).map(l => types[l.a]);
    if (others.some(a => a?.sub === 'fixed')) cash < 0 ? g.capex += cash : g.assetSale += cash;
    else if (others.some(a => a?.sub === 'loan')) g.loans += cash;
    else if (others.some(a => a?.type === 'equity')) g.equity += cash;
    else if (j.source === 'payroll' || others.some(a => a?.sub === 'payroll') || others.some(a => a?.code === '6000')) g.staff += cash;
    else if (j.source === 'tax' || others.some(a => a?.sub === 'tax' && a.type === 'liability')) g.tax += cash;
    else if (others.some(a => a?.sub === 'finance')) g.interest += cash;
    else if (cash > 0) g.receipts += cash; else g.suppliers += cash;
  }
  Object.keys(g).forEach(k => g[k] = r2(g[k]));
  const op = r2(g.receipts + g.suppliers + g.staff + g.tax + g.interest), inv = r2(g.capex + g.assetSale), fin = r2(g.loans + g.equity);
  const open = cc.reduce((s, k) => s + bal(c, k, null, addDays(from, -1)), 0), close = cc.reduce((s, k) => s + bal(c, k, null, to), 0);
  return { ...g, op, inv, fin, net: r2(op + inv + fin), open: r2(open), close: r2(close) };
}

      <div class="card"><div class="card-h"><h3>${mLabel(curK, true)}</h3><div class="row" style="gap:10px;font-size:11.5px" ><span class="row" style="gap:4px"><i style="width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block"></i>Due</span><span class="row" style="gap:4px"><i style="width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block"></i>Late</span><span class="row" style="gap:4px"><i style="width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block"></i>Filed</span></div></div><div class="card-b"><div class="cal">${cal}</div></div></div>
      <div class="card"><div class="card-h"><div><h3>VAT position · ${mLabel(mPrev(curK))}</h3><div class="sub">Return due ${dLabel(`${curK}-${pad(c.tax.vatDay)}`)}</div></div></div><div class="card-b">
        <div class="split-line"><span>Output VAT on sales invoices</span><b>${money(mt.vatOut)}</b></div><div class="split-line"><span>Less input VAT on supplier bills</span><b>${money(-mt.vatIn)}</b></div><div class="split-line"><span><b>VAT payable</b></span><b>${money(mt.vat)}</b></div></div></div>
      <div class="card"><div class="card-h"><div><h3>Company income tax · FY ${TODAY.slice(0, 4)}</h3><div class="sub">Estimate from the ledger · return due 30 June ${+TODAY.slice(0, 4) + 1}</div></div></div><div class="card-b">
        <div class="split-line"><span>Turnover to date</span><b>${money0(est.turnover)}</b></div><div class="split-line"><span>Company size</span><b>${est.small ? `Small (≤ ₦${short(c.tax.smallThreshold).slice(1)})` : 'Medium / large'}</b></div><div class="split-line"><span>Profit before tax to date</span><b>${money0(est.profit)}</b></div><div class="split-line"><span>CIT at ${est.rate}%</span><b>${money0(est.cit)}</b></div><div class="split-line"><span>Development levy ${est.small ? '(exempt)' : `at ${c.tax.devLevy}%`}</span><b>${money0(est.devl)}</b></div><div class="split-line"><span>Less WHT credit notes held</span><b>${money0(-bal(c, '1160'))}</b></div></div></div>
    </div>
  <p class="muted" style="font-size:12px;margin:0">Deadlines follow the Nigeria Tax Administration Act 2025: VAT and WHT by the ${c.tax.vatDay}st of the following month, CIT within six months of year end. PAYE is set to the ${c.tax.payeDay}th (most State IRS); pension within 7 working days of paying salaries. Change these in Settings if your state differs. Akanta reminds and prepares figures; filing itself happens on Rev360 or the State IRS portal.</p>`;
};
ACT['file-tax'] = el => {
  if (!guard('tax.file', 'mark taxes as filed')) return; const c = C(); const o = obligations(c).find(x => x.key === el.dataset.k);
  modal({ title: `Mark as filed · ${o.type} ${o.periodLabel}`, body: `<div class="callout"><span class="ic">${ic('info', 18)}</span><div><b>${TAXINFO[o.type].name}</b><p>${TAXINFO[o.type].auth} · due ${dLabel(o.due)} · ${esc(o.note)}</p></div></div>
    <div class="grid2"><div class="field"><label for="txDate">Date filed / paid</label><input type="date" class="in" id="txDate" value="${TODAY}"></div><div class="field"><label for="txRef">${['PAYE', 'H1'].includes(o.type) ? 'State IRS receipt number' : o.type === 'PEN' ? 'PFA schedule reference' : 'Rev360 acknowledgement / receipt'}</label><input class="in" id="txRef" placeholder="e.g. R360-20491177"></div></div>
    <div class="split-line" style="font-size:15px"><span>Amount</span><b>${money(o.amount)}</b></div>
    ${o.amount > 0 ? `<label class="chk"><input type="checkbox" id="txPay" checked> Post the payment from Cash at Bank (clears the ${o.type} payable)</label>` : '<p class="muted" style="margin:0">Nil return. Nothing to post.</p>'}`,
    foot: `<button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" id="txGo">Mark as filed</button>`,
    onMount: () => $('#txGo').onclick = () => attempt(() => { fileTax(c, o, { date: $('#txDate').value, ref: $('#txRef').value.trim(), pay: $('#txPay')?.checked }); closeModal(); toast(`${o.type} ${o.periodLabel} marked as filed`); render(); }) });
};

/* ================= Clients (practice dashboard) ================= */
VIEWS.clients = () => {
  const isClient = DB.role === 'client'; const cur = C();
  const rows = DB.clients.map(c => { const obs = obligations(c); const od = obs.filter(o => o.state === 'overdue').length; const nx = obs.find(o => o.state !== 'filed'); const rv = c.bank.filter(t => t.status === 'review').length; const p = pnl(c, TODAY.slice(0, 4) + '-01-01', TODAY); const docs = c.docs.filter(d => d.status === 'requested').length; const health = od ? ['bad', 'Action needed'] : rv > 5 || docs > 1 ? ['warn', 'Needs work'] : ['good', 'Up to date']; return { c, od, nx, rv, p, docs, health }; });
  return `${ph(isClient ? 'Documents' : 'Clients', isClient ? 'Upload what your accountant has asked for' : `${DB.clients.length} businesses · practice view`, isClient ? '' : `<button class="btn pri" data-act="new-client">${ic('plus', 15, 2.2)} Add client</button>`)}
  ${isClient ? '' : `<div class="card"><div class="tbl-wrap"><table class="t"><thead><tr><th>Client</th><th>Status</th><th class="r">To review</th><th>Reconciled to</th><th>Next deadline</th><th class="r">Docs pending</th><th class="r">Profit YTD</th><th></th></tr></thead><tbody>
  ${rows.map(r => `<tr class="click" data-act="switch-client" data-id="${r.c.id}"><td>${partyCell(r.c.name, r.c.industry + ' · ' + r.c.city)}</td><td>${pill(null, r.health[1]).replace('class="pill ', `class="pill ${r.health[0]} `)}</td><td class="r">${r.rv || '–'}</td><td class="nowrap">${r.c.reconciledTo ? dLabel(r.c.reconciledTo) : '<span class="down">Never</span>'}</td><td class="nowrap">${r.nx ? `<span class="${r.nx.state === 'overdue' ? 'down' : ''}">${r.nx.type} · ${dLabel(r.nx.due)}</span>` : '—'}${r.od ? ` <span class="badge bad">${r.od} late</span>` : ''}</td><td class="r">${r.docs || '–'}</td><td class="r ${r.p.net < 0 ? 'down' : ''}">${money0(r.p.net)}</td><td>${r.c.id === DB.active ? '<span class="pill acc">Open</span>' : `<button class="btn sm">Open</button>`}</td></tr>`).join('')}
  </tbody></table></div></div>`}
  <div class="card"><div class="card-h"><div><h3>Document requests · ${esc(cur.name)}</h3><div class="sub">${isClient ? 'Tap Upload next to each item' : 'Ask the client for statements, receipts and certificates'}</div></div>${isClient ? '' : `<button class="btn sm" data-act="new-doc">${ic('plus', 14)} Request document</button>`}</div>
  <div class="card-b"><div class="list">${cur.docs.map(d => `<div class="li">${ic('doc', 18)}<div class="grow"><b style="font-weight:500">${esc(d.name)}</b><small>Requested ${dLabel(d.requested)}${d.status === 'received' ? ` · received ${dLabel(d.receivedOn)}${d.file ? ' · ' + esc(d.file) : ''}` : ''}</small></div>${d.status === 'received' ? pill('paid', 'Received') : `${pill('partial', 'Waiting')}<label class="btn sm" for="up_${d.id}">${ic('upload', 14)} Upload</label><input type="file" id="up_${d.id}" hidden data-ch="doc-up" data-id="${d.id}">`}</div>`).join('') || '<div class="empty"><b>No requests</b></div>'}</div></div></div>`;
};
CH['doc-up'] = el => { const c = C(); const d = c.docs.find(x => x.id === el.dataset.id); const f = el.files[0]; if (!f) return; Object.assign(d, { status: 'received', file: f.name, receivedOn: TODAY }); audit('Uploaded document', d.name, f.name); toast('Received: ' + f.name); render(); };
ACT['new-doc'] = () => modal({ title: 'Request a document', body: `<div class="field"><label for="dName">What do you need?</label><input class="in" id="dName" placeholder="e.g. November bank statement (Excel)"></div><div class="chips">${['Bank statement (Excel/CSV)', 'Receipts for cash expenses', 'Supplier invoices', 'TIN certificate', 'CAC documents', 'Payroll changes'].map(x => `<button class="chipbtn" data-act="doc-pick" data-v="${x}">${x}</button>`).join('')}</div>`, foot: `<button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" data-act="doc-save">Send request</button>` });
ACT['doc-pick'] = el => { $('#dName').value = el.dataset.v; };
ACT['doc-save'] = () => { const n = $('#dName').value.trim(); if (!n) return toast('Describe the document', true); const c = C(); c.docs.unshift({ id: uid('d'), name: n, status: 'requested', requested: TODAY, file: '' }); audit('Requested document', n, ''); closeModal(); toast('Request added'); render(); };
ACT['new-client'] = () => {
  if (!guard('client.add', 'add clients')) return;
  modal({ title: 'Add a client', body: `<div class="field"><label for="ncName">Business name</label><input class="in" id="ncName" placeholder="e.g. Ola Foods Ltd"></div>
  <div class="grid2"><div class="field"><label for="ncInd">Industry</label><input class="in" id="ncInd"></div><div class="field"><label for="ncCity">City / state</label><input class="in" id="ncCity" value="Lagos"></div></div>
  <div class="grid2"><div class="field"><label for="ncTin">TIN</label><input class="in" id="ncTin"></div><div class="field"><label for="ncRc">RC number</label><input class="in" id="ncRc"></div></div>
  <div class="grid2"><div class="field"><label for="ncBank">Main bank account</label><input class="in" id="ncBank" placeholder="Bank · Account number"></div><div class="field"><label for="ncOpen">Opening bank balance (₦)</label><input class="in tnum" id="ncOpen" value="0" inputmode="decimal"></div></div>
  <div class="field"><label for="ncStart">Books start</label><input type="month" class="in" id="ncStart" value="${TODAY.slice(0, 4)}-01"></div>`,
    foot: `<button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" id="ncGo">Create books</button>`,
    onMount: () => $('#ncGo').onclick = () => { const name = $('#ncName').value.trim(); if (!name) return toast('Enter the business name', true); const start = $('#ncStart').value || TODAY.slice(0, 7);
      const c = blankClient({ name, industry: $('#ncInd').value.trim(), city: $('#ncCity').value.trim(), tin: $('#ncTin').value.trim(), rc: $('#ncRc').value.trim(), bankName: $('#ncBank').value.trim(), startMonth: start });
      c.profiles.push({ id: uid('p'), name, tagline: c.industry, address: c.city, email: '', phone: '', tin: c.tin, bank: c.bankName, prefix: 'INV', color: '#121418', logo: null });
      const ob = r2(parseAmt($('#ncOpen').value)); if (ob) postJournal(c, { date: start + '-01', memo: 'Opening bank balance', source: 'opening', lines: [{ a: '1000', dr: ob }, { a: '3100', cr: ob }] }, { seed: true });
      DB.clients.push(c); DB.active = c.id; audit('Created client books', name, `Books from ${mLabel(start, true)}`); closeModal(); toast(name + ' created'); UI.bankTab = 'import'; go('bank'); } });
};

/* ================= Audit trail ================= */
VIEWS.audit = () => {
  const c = C(); const q = UI.auditSearch.toLowerCase(); const ok = verifyChain(c);
  const list = c.audit.filter(e => !q || (e.action + ' ' + e.entity + ' ' + e.detail + ' ' + e.user).toLowerCase().includes(q)).slice().reverse();
  return `${ph('Audit trail', 'Every create, change, reversal and sign-off with who did it and when. Entries cannot be edited or deleted.', `<span class="pill ${ok ? 'good' : 'bad'}">${ic(ok ? 'shield' : 'alert', 13)} ${ok ? 'Chain verified' : 'Tampering detected'}</span>`)}
  <div class="card"><div class="toolbar"><div class="l"><div class="minisearch">${ic('search', 14)}<input class="in sm" id="auSearch" data-in="auSearch" placeholder="Search actions, users, records" value="${esc(UI.auditSearch)}"></div></div><div class="rt muted">${c.audit.length} entries</div></div>
  <div class="tbl-wrap"><table class="t"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Record</th><th>Details</th><th>Hash</th></tr></thead><tbody>
  ${list.slice(0, 300).map(e => `<tr><td class="nowrap">${new Date(e.at).toLocaleString('en-NG', { dateStyle: 'medium', timeStyle: 'short' })}</td><td class="nowrap">${esc(e.user)}</td><td>${esc(e.action)}</td><td>${esc(e.entity)}</td><td class="muted" style="max-width:320px">${esc(e.detail)}</td><td class="hash">${e.h.slice(0, 10)}</td></tr>`).join('')}
  </tbody></table></div></div>`;
};
CH.auSearch = el => { UI.auditSearch = el.value; clearTimeout(CH._as); CH._as = setTimeout(() => { const p = el.selectionStart; render(); const n = $('#auSearch'); if (n) { n.focus(); n.setSelectionRange(p, p); } }, 250); };

/* ================= Settings ================= */
VIEWS.settings = () => {
  const c = C(); const t = UI.setTab;
  const f = (id, label, val, attrs = '') => `<div class="field"><label for="${id}">${label}</label><input class="in" id="${id}" value="${esc(val ?? '')}" ${attrs}></div>`;
  let body = '';
  if (t === 'company') body = `<div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:12px;max-width:760px">
    <div class="grid2">${f('sName', 'Business name', c.name)}${f('sInd', 'Industry', c.industry)}</div>
    <div class="grid2">${f('sTin', 'TIN', c.tin)}${f('sRc', 'RC number', c.rc)}</div>
    ${f('sAddr', 'Address', c.address)}
    <div class="grid3">${f('sCity', 'City / state', c.city)}${f('sEmail', 'Email', c.email)}${f('sPhone', 'Phone', c.phone)}</div>
    ${f('sBank', 'Main bank account', c.bankName)}
    <div><button class="btn pri" data-act="save-company">Save details</button></div></div></div>`;
  else if (t === 'profiles') body = `<div class="card"><div class="toolbar"><div class="l"><b>Businesses you invoice from</b></div><div class="rt"><button class="btn sm pri" data-act="new-profile">${ic('plus', 14)} Add business</button></div></div><div class="card-b" style="padding-top:0"><div class="list">
    ${c.profiles.map(p => `<div class="li">${p.logo ? `<img class="pv-logo" src="${p.logo}" alt="" style="width:38px;height:38px">` : `<span class="pv-logo" style="width:38px;height:38px;background:${esc(p.color || '#15171c')}">${initials(p.name)}</span>`}<div class="grow"><b style="font-weight:500">${esc(p.name)}</b><small>Prefix ${esc(p.prefix)} · ${esc(p.bank || 'no bank details')}</small></div><button class="btn sm" data-act="edit-profile" data-id="${p.id}">Edit</button></div>`).join('')}</div></div></div>`;
  else if (t === 'tax') body = `<div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:12px;max-width:760px">
    <div class="grid3">${f('tVat', 'VAT rate %', c.tax.vat, 'inputmode="decimal"')}${f('tCit', 'CIT rate % (non-small)', c.tax.cit, 'inputmode="decimal"')}${f('tDev', 'Development levy %', c.tax.devLevy, 'inputmode="decimal"')}</div>
    <div class="grid3">${f('tSmall', 'Small company turnover limit (₦)', c.tax.smallThreshold, 'inputmode="decimal"')}${f('tPe', 'Employee pension %', c.tax.penEmp)}${f('tPr', 'Employer pension %', c.tax.penEr)}</div>
    <div class="grid3">${f('tVatD', 'VAT due day (next month)', c.tax.vatDay)}${f('tWhtD', 'WHT due day', c.tax.whtDay)}${f('tPayeD', 'PAYE due day', c.tax.payeDay)}</div>
    <div class="grid3">${f('tRem', 'Remind me this many days before', c.tax.remindDays)}</div>
    <div class="row"><button class="btn pri" data-act="save-tax">Save tax settings</button><button class="btn ghost" data-act="reset-tax">Restore defaults</button></div></div></div>`;
  else if (t === 'lock') body = `<div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:14px;max-width:640px">
    <div class="callout"><span class="ic">${ic('lock', 18)}</span><div><b>${c.lockDate ? 'Locked through ' + dLabel(c.lockDate) : 'No period is locked'}</b><p>Once a month or year is closed and reviewed, lock it so no one can post, change or reverse entries dated on or before the lock date.</p></div></div>
    <div class="field"><label for="lkDate">Lock books through</label><input type="date" class="in" id="lkDate" value="${c.lockDate || ''}" style="max-width:240px"></div>
    <div class="row"><button class="btn pri" data-act="save-lock">Update lock</button>${c.lockDate ? '<button class="btn" data-act="clear-lock">Remove lock</button>' : ''}</div>
    <p class="muted" style="font-size:12.5px;margin:0">Every change to the lock is written to the audit trail.</p></div></div>`;
  else body = `<div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:14px;max-width:640px">
    <div class="field"><label for="uName">Your name (shown on the audit trail and reports)</label><input class="in" id="uName" value="${esc(userName())}" style="max-width:320px"></div><div><button class="btn" data-act="save-user">Save name</button></div>
    <div class="callout"><span class="ic">${ic('info', 18)}</span><div><b>Where your data lives</b><p>This version keeps all books in this browser on this device. Clearing browser data removes them. For shared, multi-user access the next step is a hosted database with sign-in.</p></div></div>
    <div class="row">${C().sample ? '<button class="btn pri" data-act="start-fresh">Clear examples & start with real books</button>' : ''}<button class="btn danger" data-act="reset-all">Load example data again</button></div></div></div>`;
  return `${ph('Settings', esc(c.name), '')}${tabs('setTab', t, [['company', 'Company'], ['profiles', 'Invoice businesses'], ['tax', 'Tax & deadlines'], ['lock', 'Period lock'], ['data', 'Account & data']])}${body}`;
};
ACT['save-company'] = () => { if (!guard('settings', 'change company settings')) return; const c = C(); Object.assign(c, { name: $('#sName').value.trim() || c.name, industry: $('#sInd').value.trim(), tin: $('#sTin').value.trim(), rc: $('#sRc').value.trim(), address: $('#sAddr').value.trim(), city: $('#sCity').value.trim(), email: $('#sEmail').value.trim(), phone: $('#sPhone').value.trim(), bankName: $('#sBank').value.trim() }); audit('Edited company details', c.name, ''); toast('Saved'); render(); };
ACT['new-profile'] = () => profileModal();
ACT['edit-profile'] = el => profileModal(C().profiles.find(p => p.id === el.dataset.id));
ACT['save-tax'] = () => { if (!guard('settings', 'change tax settings')) return; const c = C(); const n = id => parseFloat(String($('#' + id).value).replace(/,/g, '')); const t = { vat: n('tVat'), cit: n('tCit'), devLevy: n('tDev'), smallThreshold: n('tSmall'), penEmp: n('tPe'), penEr: n('tPr'), vatDay: n('tVatD'), whtDay: n('tWhtD'), payeDay: n('tPayeD'), remindDays: n('tRem') }; if (Object.values(t).some(v => isNaN(v) || v < 0)) return toast('All fields need a number', true); if ([t.vatDay, t.whtDay, t.payeDay].some(d => d < 1 || d > 28)) return toast('Due days must be between 1 and 28', true); Object.assign(c.tax, t); audit('Changed tax settings', 'Tax', JSON.stringify(t)); toast('Tax settings saved'); render(); };
ACT['reset-tax'] = () => { if (!guard('settings', 'change tax settings')) return; C().tax = DEFAULT_TAX(); audit('Restored default tax settings', 'Tax', ''); render(); };
ACT['save-lock'] = () => { if (!guard('lock', 'change the period lock')) return; const c = C(); const d = $('#lkDate').value; if (!d) return toast('Pick a date', true); const old = c.lockDate; c.lockDate = d; audit('Locked period', 'Books', `${old ? dLabel(old) : 'none'} → ${dLabel(d)}`); toast('Books locked through ' + dLabel(d)); render(); };
ACT['clear-lock'] = () => { if (!guard('lock', 'change the period lock')) return; const c = C(); audit('Removed period lock', 'Books', 'was ' + dLabel(c.lockDate)); c.lockDate = null; toast('Lock removed'); render(); };
ACT['save-user'] = () => { const v = $('#uName').value.trim(); if (!v) return; DB.user = v; toast('Saved'); render(); };
ACT['reset-all'] = () => { if (!guard('reset', 'reset data')) return; modal({ title: 'Reset everything?', body: '<p style="margin:0">All entries and settings in this browser are replaced with the example figures. This cannot be undone.</p>', foot: `<button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" data-act="reset-go">Reset</button>` }); };
ACT['reset-go'] = () => { const theme = DB.theme; DB = freshDB(); DB.theme = theme; invalidate(); closeModal(); UI.imp = null; UI.draft = null; toast('Example data restored'); go('overview'); };

ACT['start-fresh'] = () => {
  const c = C();
  modal({ title: 'Start with real books', body: `<p style="margin:0">This clears all example transactions, invoices, staff and reports. Your company details, invoice businesses and tax settings are kept.</p>
    <div class="grid2"><div class="field"><label for="sfStart">Books start from</label><input type="month" class="in" id="sfStart" value="${TODAY.slice(0, 7)}"></div><div class="field"><label for="sfOpen">Bank balance on that date (₦)</label><input class="in tnum" id="sfOpen" value="0" inputmode="decimal"></div></div>
    <p class="muted" style="margin:0;font-size:12.5px">Next: upload your bank statements from that month onward, add your staff under Payroll, and fill in your TIN and bank details in Settings.</p>`,
    foot: `<button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" id="sfGo">Clear examples</button>`,
    onMount: () => $('#sfGo').onclick = () => { const start = $('#sfStart').value || TODAY.slice(0, 7); DB = freshRealDB(r2(parseAmt($('#sfOpen').value)), start, c); invalidate(); audit('Started real books', C().name, `From ${mLabel(start, true)}`); closeModal(); UI.imp = null; UI.draft = null; UI.bankTab = 'import'; toast('Example data cleared. Upload your first statement.'); go('bank'); } });
};

/* ================= Boot ================= */
(function boot() {
  DB = loadDB();
  if (!DB || !DB.clients?.length || DB.v !== 2) DB = freshDB();
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!DB.theme) render(); });
  render();
  const drop = () => $('#drop');
  document.addEventListener('dragover', e => { const d = drop(); if (d && d.contains(e.target)) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', e => { const d = drop(); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', e => { const d = drop(); if (d && d.contains(e.target)) { e.preventDefault(); d.classList.remove('over'); const inp = $('#fileIn'); if (e.dataTransfer.files[0]) { const dt = new DataTransfer(); dt.items.add(e.dataTransfer.files[0]); inp.files = dt.files; CH.file(inp); } } });
  window.addEventListener('load', () => { if (window.Chart) render(); });
})();
</script>

</body>
</html>
